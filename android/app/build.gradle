apply plugin: 'com.android.application'

android {
    namespace "com.potakariyeri.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.potakariyeri.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Sürüm: CI'da VERSION_CODE (github.run_number) + VERSION_CODE_OFFSET ile her derlemede artar.
        // Play aynı versionCode'u iki kez kabul etmez ve küçülmesine izin vermez; elle AAB yüklersen OFFSET'i büyüt.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1") + Integer.parseInt(System.getenv("VERSION_CODE_OFFSET") ?: "0")
        versionName(System.getenv("VERSION_NAME") ?: "1.0.0")
        // AdMob uygulama kimliği TEK noktadan: ADMOB_APP_ID ortam değişkeni (CI'da GitHub Secrets). Yoksa Google'ın test kimliği.
        resValue "string", "admob_app_id", (System.getenv("ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Yayın imzası: anahtar deposu bilgileri ortam değişkenlerinden gelir (CI'da GitHub Secrets). Yoksa imzasız derlenir.
    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Kod küçültme kapalı: uygulama kodu WebView'de (JS); R8 Capacitor/Cordova eklentilerinin yansıma ile
            // çağrılan sınıflarını silebilir. Açmak istersen önce proguard-rules.pro'ya eklenti kuralları eklenmeli.
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Yayın kapısı: test AdMob kimliğiyle imzalı yayın paketi üretilmesin (docs/YAYIN_KONTROL.md).
// Kapalı test için bilerek test reklamı istiyorsan ALLOW_TEST_ADS=1.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.name in ['bundleRelease', 'assembleRelease'] }
    def appId = System.getenv("ADMOB_APP_ID") ?: ""
    if (releasing && System.getenv("ALLOW_TEST_ADS") != "1" && (appId == "" || appId.startsWith("ca-app-pub-3940256099942544"))) {
        throw new GradleException("ADMOB_APP_ID tanımlı değil ya da Google test kimliği. Yayın paketi durduruldu (ALLOW_TEST_ADS=1 ile atlanabilir).")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
