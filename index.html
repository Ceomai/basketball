<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pota Kariyeri</title>
<meta name="description" content="İstanbul'dan dünyanın zirvesine basketbol kariyer simülasyonu">
<meta name="theme-color" content="#090d15">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pota Kariyeri">
<style>
/* Layout: yayın grafiği estetiği — koyu zemin, takım rengi vurgu, üstte sabit oyuncu şeridi, ortada şehir haritası, aşağıdan açılan paneller */
:root{
  --bg:#090d15; --bg2:#0e141f; --card:#121a28; --card2:#182233; --line:#223047; --line2:#2f3f5c;
  --text:#eef2f8; --muted:#8c99ae; --dim:#5d6b82; --gold:#d8b25a;
  --hot:#ff6a2b; --good:#36d38e; --bad:#ff5468; --warn:#ffc54d; --info:#58a6ff;
  --team:#ff6a2b; --team2:#ffffff; --team-ink:#140a04;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;letter-spacing:.3px;margin:0;text-wrap:balance;text-transform:uppercase;line-height:1.02}
h1{font-size:2.6rem;font-weight:800} h2{font-size:1.5rem} h3{font-size:1.08rem;letter-spacing:.6px}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.82rem} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .nowrap{flex-wrap:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.8px;text-transform:uppercase;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;cursor:pointer;line-height:1;text-align:center;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.loc:focus-visible,.choice:focus-visible,.opt:focus-visible,.tabs button:focus-visible,.prod:focus-within{outline:2px solid var(--warn);outline-offset:2px}
.btn.pri{background:var(--hot);border-color:var(--hot);color:#140a04}
.btn.team{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good);border-color:var(--good);color:#04140c}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#1a0307}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1205}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{font-size:1.35rem;padding:15px 16px}
.btn.sm{font-size:.85rem;padding:8px 10px}
input[type=text]{font-family:var(--body);font-weight:700;font-size:1rem;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;background:var(--bg2);width:100%;color:var(--text)}
input[type=text]:focus{outline:2px solid var(--team);border-color:transparent}
label{display:flex;flex-direction:column;gap:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-family:var(--body);font-weight:700;font-size:.85rem;border:1px solid var(--line2);background:var(--bg2);color:var(--text);border-radius:9px;padding:7px 11px;cursor:pointer}
.opt.on{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.opt .cc{font-family:var(--display);font-size:.75rem;letter-spacing:1px;opacity:.7;margin-right:5px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;padding:0}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
canvas{display:block;max-width:100%}

/* Üst şerit */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg2);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
@media (min-width:600px){.hud{border-radius:0 0 14px 14px;border:1px solid var(--line);border-top:0}}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0}
.hud-id .nm{font-family:var(--display);font-size:1.25rem;font-weight:700;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-id .tm{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-money{margin-left:auto;text-align:right;flex-shrink:0}
.hud-money b{font-family:var(--display);font-size:1.3rem;font-weight:700;display:block;line-height:1;color:var(--gold)}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hs{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.hs .k{font-family:var(--display);font-size:.66rem;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs .v{font-family:var(--display);font-size:1.05rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.mt i{display:block;height:100%;background:var(--good)}
.avatar{width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);flex-shrink:0;overflow:hidden}

/* Harita */
.mapwrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.mapwrap svg{display:block;width:100%;height:auto}
.mapin{position:relative;width:100%}
.maphead{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.tagx{background:rgba(9,13,21,.84);border:1px solid rgba(216,178,90,.25);border-radius:8px;padding:5px 9px;font-family:var(--display);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:.85rem;line-height:1.1;color:var(--text)}
.tagx small{display:block;font-family:var(--body);font-weight:600;letter-spacing:0;text-transform:none;font-size:.7rem;color:var(--muted)}
.loc{cursor:pointer;outline:none}
.loc .hl{opacity:0;transition:opacity .15s}
.loc:hover .hl,.loc:focus-visible .hl{opacity:1}
.loc.off{opacity:.5}
.timebar{display:flex;gap:4px;align-items:center}
.timebar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.timebar i.on{background:var(--gold)}
.next{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.vs{font-family:var(--display);font-weight:700;color:var(--muted);font-size:.9rem}
.news div{padding:8px 0;border-top:1px solid var(--line);font-size:.86rem;display:grid;grid-template-columns:52px 1fr;gap:8px}
.news div:first-child{border-top:0}
.news time{font-family:var(--display);color:var(--muted);font-size:.78rem;letter-spacing:.6px;padding-top:1px}

/* Panel */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,12,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-b>*{flex-shrink:0}
.sheet-b{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:1.1rem;cursor:pointer;flex-shrink:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
/* ekran geçişi ve düşük grafik modu */
.app.enter>*{animation:enter .26s ease both}.app.enter>*:nth-child(2){animation-delay:.03s}.app.enter>*:nth-child(3){animation-delay:.06s}.app.enter>*:nth-child(4){animation-delay:.09s}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
body.lowfx *,body.lowfx *::before,body.lowfx *::after{animation:none!important;transition:none!important}
body.lowfx .sheet-bg{backdrop-filter:none}
/* erişilebilirlik: yazı boyutu (rem tabanı ölçeklenir) ve renk körlüğü modu (yeşil/kırmızı yerine mavi/turuncu) */
html.fs-l{font-size:18px} html.fs-l body{font-size:15.75px}
html.fs-xl{font-size:20px} html.fs-xl body{font-size:17.5px} html.fs-xl [data-dist]{font-size:.88em}
html.cb{--good:#4aa8ff;--bad:#ff9b3d}
html.cb .pill.w{background:rgba(74,168,255,.15)} html.cb .pill.l{background:rgba(255,155,61,.15)}
html.cb .fx .p{background:rgba(74,168,255,.12)} html.cb .fx .n{background:rgba(255,155,61,.12)}
html.cb .btn.good{color:#03111f}
/* paket 4a: küçük yazı, renk körü ek bölgeler, yüksek kontrast (tema değişkenlerinin üstüne çıkar), ekran okuyucu, ilk maç rehberi */
html.fs-s{font-size:14.5px} html.fs-s body{font-size:12.75px}
html.cb[data-theme]{--good:#4aa8ff;--bad:#ff9b3d}
html.cb .od.e{background:rgba(74,168,255,.15)} html.cb .od.h{background:rgba(255,155,61,.15)}
html.cb .qbtn.ok{background:rgba(74,168,255,.18)} html.cb .qbtn.no{background:rgba(255,155,61,.15)}
html.hc,html.hc[data-theme]{--bg:#000;--bg2:#05070b;--card:#0b0f17;--card2:#121826;--line:#5b6b86;--line2:#8fa1c2;--text:#fff;--muted:#d0d8e6;--dim:#a9b4c6;--gold:#ffd166}
html.hc .btn,html.hc .opt,html.hc .choice,html.hc .card,html.hc .act{border-width:2px}
html.hc :focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mt-hl{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px;animation:mtPulse 1s ease-in-out infinite alternate}
@keyframes mtPulse{to{outline-color:rgba(216,178,90,.35)}}
.mt-bub{position:fixed;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:46;border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.mt-bub .grid2 .btn{min-height:40px}
.act{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act .ai{width:52px;height:52px;border-radius:10px;background:radial-gradient(circle at 50% 35%,#24324b,#121a28);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act .ai svg{width:40px;height:40px}
.act h3{font-size:1.02rem}
.act>.btn{grid-column:1/-1;width:100%}
.act>span:first-child{display:none}
.act p{font-size:.78rem;color:var(--muted);margin-top:2px}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fx span{font-size:.7rem;font-weight:800;border-radius:5px;padding:2px 6px;background:var(--card2);color:var(--muted)}
.fx .p{color:var(--good);background:rgba(54,211,142,.12)} .fx .n{color:var(--bad);background:rgba(255,84,104,.12)} .fx .t{color:var(--warn);background:rgba(255,197,77,.12)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.tabs button{min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:.88rem;background:var(--card);color:var(--muted);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tabs button:hover{color:var(--text);border-color:var(--muted)}
.tabs button.on{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.tabs button svg{width:16px;height:16px}
.attr{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-weight:700;font-size:.85rem}
.attr b{font-family:var(--display);font-size:1.1rem;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--team);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{font-family:var(--display);font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-size:.72rem;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.me td{background:rgba(255,255,255,.05);font-weight:800}
.tbl{overflow-x:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.86rem}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.big-num{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;letter-spacing:.8px;font-size:.75rem;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--card2);color:var(--muted)}
.pill.w{background:rgba(54,211,142,.15);color:var(--good)} .pill.l{background:rgba(255,84,104,.15);color:var(--bad)} .pill.g{background:rgba(216,178,90,.15);color:var(--gold)}
.toast.top{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-left:4px solid var(--team);border-radius:10px;padding:10px 14px;font-weight:700;z-index:40;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.say{background:var(--card2);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.9rem;border-left:3px solid var(--team)}
.who{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.chapter{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.chapter .hd{padding:18px 16px 14px;background:var(--team);color:var(--team-ink)}
.chapter .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}

/* Sahneler ve ürünler */
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.scene canvas{width:100%;height:auto}
.bubble{position:absolute;right:10px;top:10px;max-width:55%;background:#fff;color:#141414;border-radius:12px;padding:8px 10px;font-weight:700;font-size:.8rem;line-height:1.3;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.bubble.l{right:auto;left:10px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prod .ic{background:radial-gradient(circle at 50% 38%,#26354f,#111926 75%);border-radius:10px;display:flex;align-items:center;justify-content:center;aspect-ratio:1.5}
.prod .ic svg{width:62%;height:auto;max-height:84%}
.prod h3{font-size:.98rem}
.prod p{font-size:.74rem;color:var(--muted)}
.prod .btn{margin-top:auto}
.prod.own{opacity:.7}

/* Maç */
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);margin-top:10px}
.bug .side{display:flex;align-items:center;gap:8px;padding:8px 10px;min-width:0}
.bug .side.r{flex-direction:row-reverse;text-align:right}
.bug .ab{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:1px;line-height:1}
.bug .full{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.bug .sc{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums}
.bug .side.r .sc{margin-left:0;margin-right:auto}
.bug .mid{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;min-width:70px}
.bug .q{font-family:var(--display);font-weight:700;color:var(--warn);font-size:.85rem;letter-spacing:1px}
.bug .clk{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stripe{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0}
.sit{display:flex;flex-direction:column;gap:12px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--text);cursor:pointer;font-family:var(--body)}
.choice:active{transform:scale(.98)}
.choice .ct{font-family:var(--display);font-weight:700;font-size:1.22rem;text-transform:uppercase;letter-spacing:.5px}
.choice .cd{font-size:.78rem;color:var(--muted);grid-column:1}
.choice .od{grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:.8rem;padding:4px 8px;border-radius:6px}
.od.e{background:rgba(54,211,142,.15);color:var(--good)} .od.m{background:rgba(255,197,77,.15);color:var(--warn)} .od.h{background:rgba(255,84,104,.15);color:var(--bad)} .od.i{background:rgba(88,166,255,.15);color:var(--info)}
.stage{background:#05080e;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.stage canvas{width:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Mobil dokunuş: çift dokunuşta yakınlaştırma yok, oyun alanında metin seçimi ve uzun basma menüsü yok */
button,.loc,.choice,.opt,.venue,.tabs button{touch-action:manipulation}
.btn,.choice,.opt,.tabs,.stage,.mgctrl,.hud,.mapwrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{overscroll-behavior-y:none}
textarea,input[type=text]{font-size:16px;box-sizing:border-box;min-width:0;max-width:100%}
.grid2>*{min-width:0}
.sheet-h .shx,#shx{min-width:40px;min-height:40px}
/* tek elle kullanım: uzun panellerde birincil düğme parmak bölgesinde (altta yapışkan), karar kartları büyük ve alta hizalı */
.sheet-b>.btn.pri:last-child,.sn-pane>.btn.pri:last-child{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 12px -4px var(--bg2)}
.sheet-b>.choices:last-child{margin-top:auto}
@media (pointer:coarse){.choice{min-height:58px;padding:15px 16px}}
/* Sezon Gecesi sekmeleri (src/seasonnight.js) */
.sn-tabs{position:sticky;top:0;z-index:3;background:var(--bg2);padding-bottom:4px}
.sn-pane{display:flex;flex-direction:column;gap:10px}.sn-pane>*{flex-shrink:0}.sn-pane[hidden]{display:none}
/* bildirim kutusu zili ve koç önerisi (src/inbox.js) */
.ibx-bell{position:relative;flex-shrink:0;width:40px;height:40px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--text);cursor:pointer;padding:0}
.ibx-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;line-height:1}
.ibx-n[hidden]{display:none}
.ctip{margin-top:6px;padding:6px 10px;border-left:3px solid var(--warn);background:rgba(255,197,77,.08);border-radius:6px;line-height:1.3}
@media (pointer:coarse){.btn.sm{min-height:42px}.opt{min-height:40px;min-width:40px}.sw{min-width:34px;min-height:34px}.tabs button{min-height:40px}}
/* Yatay telefonda oyun alanı ekrana sığsın */
@media (orientation:landscape) and (max-height:560px){.stage{width:min(100%,calc((100dvh - 120px)*.75));align-self:center;margin-inline:auto}.mgctrl .btn{padding:10px 0}}
.mgtop{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;font-size:.9rem;border-bottom:1px solid var(--line)}
.mgctrl{display:flex;gap:8px;justify-content:center;padding:10px;flex-wrap:nowrap}
.mgctrl:empty{display:none}
.mgctrl .btn{flex:1;font-size:1.5rem;padding:16px 0;min-width:0}
.feed div{padding:6px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:58px 1fr;gap:8px;font-size:.84rem}
.feed div:first-child{border-top:0}
.feed time{font-family:var(--display);color:var(--muted);letter-spacing:.5px}
.box{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.box div{background:var(--card2);border-radius:10px;padding:8px 4px}
.box b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1;font-weight:800}
.rating{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:.9}

/* Quiz, gönderi, kumar */
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px;color:var(--text);font-family:var(--body);font-weight:700;font-size:.9rem;cursor:pointer;text-align:left;min-height:52px}
.qbtn.ok{background:rgba(54,211,142,.18);border-color:var(--good)} .qbtn.no{background:rgba(255,84,104,.15);border-color:var(--bad)}
.post{background:#fff;color:#141414;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.post .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:800;font-size:.85rem}
.post .ph i{width:28px;height:28px;border-radius:50%;background:var(--team);display:block}
.post img{display:block;width:100%;height:auto}
.post .pb{padding:10px 12px;font-size:.84rem;display:flex;flex-direction:column;gap:5px}
.post .lk{font-weight:800}
.felt{background:radial-gradient(circle at 50% 30%,#17734a,#0a3a25 80%);border:1px solid #1f6b47;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.hand{display:flex;gap:6px;min-height:78px;flex-wrap:wrap;justify-content:center}
.cardx{width:52px;height:76px;border-radius:7px;background:#fff;color:#141414;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:deal .25s ease-out}
.cardx.red{color:#d0142c} .cardx.back{background:repeating-linear-gradient(45deg,#8a1d2a 0 6px,#a8273a 6px 12px);border:3px solid #fff}
.cardx span:last-child{align-self:flex-end;transform:rotate(180deg)}
@keyframes deal{from{transform:translateY(-20px) rotate(-8deg);opacity:0}}
.reels{display:flex;gap:8px;justify-content:center;background:#1b0d0d;padding:12px;border-radius:14px;border:3px solid var(--gold)}
.reel{width:84px;height:92px;background:#fffaf0;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 8px 14px rgba(0,0,0,.25),inset 0 -8px 14px rgba(0,0,0,.25)}
.reel svg{width:58px;height:58px}
.reel.spin svg{animation:spin .09s linear infinite}
@keyframes spin{from{transform:translateY(-36px)}to{transform:translateY(36px)}}
.venues{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.venue{position:relative;padding:0;border:2px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;text-align:left;color:var(--text)}
.venue canvas{width:100%;height:auto;display:block;filter:saturate(.75) brightness(.7)}
.venue .vlab{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:linear-gradient(transparent,rgba(5,8,14,.95));display:flex;flex-direction:column}
.venue .vlab b{font-family:var(--display);font-size:1.15rem;letter-spacing:.8px;text-transform:uppercase;line-height:1}
.venue .vlab small{font-size:.7rem;color:var(--muted)}
.venue.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(216,178,90,.35)}
.venue.on canvas{filter:none}
.venue.on .vlab b{color:var(--gold)}
.venue:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
@media (max-width:380px){h1{font-size:2.1rem}.reel{width:70px}}
@media (prefers-reduced-motion:reduce){.app.enter>*,.sheet,.sheet-bg,.cardx{animation:none}.btn,.loc .hl{transition:none}.reel.spin svg{animation-duration:.4s}}
/* Reklam */
.adbtn{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding-top:18px}
.adbtn small{font-family:var(--body);font-size:.7rem;font-weight:600;text-transform:none;letter-spacing:0;opacity:.75}
.adtag{position:absolute;top:4px;left:8px;font-size:.58rem;letter-spacing:1px;background:rgba(0,0,0,.35);border-radius:4px;padding:1px 5px}
#adov{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.94);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.adbox{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.adbody{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:12px;padding:22px 16px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.btn:disabled{opacity:.5;cursor:default}
/* Mobil sığdırma: kaydırma çubukları gizli (kaydırma çalışmaya devam eder);
   ana ekranda şerit, harita ve "Bu hafta" kartı tek ekrana sığar */
@media (pointer:coarse),(max-width:700px){
  html,body,*{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0!important;height:0!important;display:none}
}
@media (max-width:600px){
  .app{gap:10px}
  .hud{padding-top:8px;padding-bottom:8px;gap:6px}
  .avatar{width:36px;height:36px;border-radius:9px}
  .hud-id .nm{font-size:1.1rem}
  .hud-money b{font-size:1.15rem}
  .hud-stats{gap:5px}
  .hs{padding:4px 6px}
  .hs .k{font-size:.58rem;letter-spacing:.5px}
  .hs .v{font-size:.95rem}
  /* harita alanı genişlikte tam doldurur (yanlarda boşluk yok). Yükseklik: maç kartı ekranda kalacak kadar; ekran
     yetmezse yalnızca üstteki gökyüzü/silüet kırpılır (en fazla %12, mekanlar ve etiketleri hep görünür), daha kısa ekranda sayfa kayar */
  .mapin{width:100%}
  .mapwrap svg{--nat:calc((100vw - 48px) * 1.675);width:100%;height:clamp(calc(var(--nat) * .88),calc(100dvh - 320px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),var(--nat))}
  .maphead{left:6px;right:6px;top:6px;gap:5px}
  .maphead .tagx{font-size:.8rem;padding:4px 7px;max-width:50%}
  .maphead .tagx small{font-size:.62rem}
  /* maç kartı %10 küçük ve dikeyde sıkı: haritanın uzayan alanına yer açar */
  .weekcard{zoom:.9;padding:8px 11px;gap:6px}
  .weekcard .next{padding:2px 0;gap:10px}
  .weekcard .btn{padding:9px 12px}
}
</style>
</head>

<div class="app" id="app"></div>
<div id="ovl"></div>
