<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pota Kariyeri</title>
<meta name="description" content="İstanbul'dan dünyanın zirvesine basketbol kariyer simülasyonu">
<meta name="theme-color" content="#090d15">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pota Kariyeri">
<style>
/* Layout: yayın grafiği estetiği — koyu zemin, takım rengi vurgu, üstte sabit oyuncu şeridi, ortada şehir haritası, aşağıdan açılan paneller */
:root{
  /* TEMA TOKEN'LARI — tek kaynak. Temalar (src/custom.js THEME_CSS), renk körü (html.cb) ve yüksek kontrast (html.hc) yalnız bu değişkenleri ezer.
     Tuval/SVG çizimleri aynı değerleri src/theme.js tok() ile okur. */
  /* renk */
  --bg:#090d15; --bg2:#0e141f; --card:#121a28; --card2:#182233; --line:#223047; --line2:#2f3f5c;
  --text:#eef2f8; --muted:#8c99ae; --dim:#5d6b82; --gold:#d8b25a;
  --hot:#ff6a2b; --good:#36d38e; --bad:#ff5468; --warn:#ffc54d; --info:#58a6ff;
  --team:#ff6a2b; --team2:#ffffff; --team-ink:#140a04;
  --stage-bg:#05080e;
  /* denetim bileşeni kenarlığı (düğme, seçenek, giriş, ✕): koyu zeminlerde ≥3:1 (WCAG 1.4.11) */
  --line-ctl:#64748c;
  /* seçili durum (seçenek, sekme, anahtar): takım renginden bağımsız sabit nötr vurgu */
  --sel:#c9d6ea; --on-sel:#0a0f18;
  /* bildirim rozeti: koyu yazı / --bad zemin (≥4,5:1) */
  --badge-bg:var(--bad); --on-badge:var(--on-bad);
  /* dokunma alanı alt sınırı (iOS 44pt, Android 48dp) */
  --hit:44px; --hit-coarse:48px;
  /* küçük yazı alt sınırı */
  --fs-min:11px;
  /* dolu düğmelerin yazı rengi (zemin rengiyle birlikte temalarca ezilir) */
  --pri:var(--hot); --on-hot:#140a04; --on-good:#04140c; --on-bad:#1a0307; --on-gold:#1a1205; --on-info:#03111f;
  /* anlamsal ton zeminleri: renk token'ından türetilir; tema/renk körü modu değişince tonlar da değişir */
  --good-bg:color-mix(in srgb,var(--good) 15%,transparent); --good-soft:color-mix(in srgb,var(--good) 12%,transparent);
  --bad-bg:color-mix(in srgb,var(--bad) 15%,transparent); --bad-soft:color-mix(in srgb,var(--bad) 12%,transparent);
  --warn-bg:color-mix(in srgb,var(--warn) 15%,transparent); --warn-soft:color-mix(in srgb,var(--warn) 12%,transparent);
  --gold-bg:color-mix(in srgb,var(--gold) 15%,transparent); --gold-soft:color-mix(in srgb,var(--gold) 12%,transparent);
  --info-bg:color-mix(in srgb,var(--info) 15%,transparent);
  /* yazı */
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --fs-3xs:.6rem; --fs-2xs:.68rem; --fs-xs:.74rem; --fs-sm:.8rem; --fs-md:.86rem; --fs-base:.9rem; --fs-lg:.96rem;
  --fs-xl:1rem; --fs-2xl:1.06rem; --fs-3xl:1.12rem; --fs-4xl:1.22rem; --fs-5xl:1.32rem; --fs-6xl:1.4rem; --fs-h2:1.5rem;
  --fs-7xl:1.6rem; --fs-8xl:1.8rem; --fs-num:2rem; --fs-h1-sm:2.1rem; --fs-big:2.4rem; --fs-h1:2.6rem; --fs-display:3rem; --fs-hero:3.4rem;
  /* boşluk (4px ızgara + yarım adımlar) */
  --sp-half:2px; --sp-1:4px; --sp-1h:6px; --sp-2:8px; --sp-2h:10px; --sp-3:12px; --sp-3h:14px; --sp-4:16px; --sp-4h:18px;
  --sp-5:20px; --sp-5h:22px; --sp-6:24px; --sp-7:28px; --sp-8:32px;
  /* köşe */
  --r-2xs:2px; --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-2xl:14px; --r-3xl:16px; --r-4xl:18px; --r-pill:999px; --r-round:50%;
  /* gölge */
  --shadow-1:0 10px 30px rgba(0,0,0,.4); --shadow-2:0 10px 30px rgba(0,0,0,.6);
  --shadow-sm:0 4px 10px rgba(0,0,0,.35); --shadow-md:0 6px 16px rgba(0,0,0,.35); --shadow-tab:0 2px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--sp-8) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--sp-3)}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;letter-spacing:.3px;margin:0;text-wrap:balance;text-transform:uppercase;line-height:1.02}
h1{font-size:var(--fs-h1);font-weight:800} h2{font-size:var(--fs-h2)} h3{font-size:var(--fs-2xl);letter-spacing:.6px}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:var(--fs-sm);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:var(--fs-sm)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--sp-3h);display:flex;flex-direction:column;gap:var(--sp-2h);min-width:0}
.row{display:flex;gap:var(--sp-2h);align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .nowrap{flex-wrap:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2h)} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.btn{font-family:var(--display);font-weight:700;font-size:var(--fs-2xl);letter-spacing:.8px;text-transform:uppercase;color:var(--text);background:var(--card2);border:1px solid var(--line-ctl);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-3h);cursor:pointer;line-height:1;text-align:center;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.loc:focus-visible,.choice:focus-visible,.opt:focus-visible,.tabs button:focus-visible,.prod:focus-within{outline:2px solid var(--warn);outline-offset:2px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-hot)}
/* düğme rolleri: birincil tek (.pri); .team artık ikincil eylem (takım rengi yalnız kimlik alanlarında: arma, şerit,
   bölüm başlığı, harita stadyumu); seçili durum .sel (sabit nötr); ödüllü reklam .ad (kenarlıklı, altın simge) */
.btn.team{background:var(--card2);border-color:var(--line-ctl);color:var(--text)}
.btn.sel{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.btn.ad{background:var(--card);border:1px solid var(--gold);color:var(--text)}
.btn.ad .adtag{color:var(--gold);background:var(--gold-bg);display:inline-flex;align-items:center;gap:3px}
.btn.ad .adtag svg{fill:var(--gold)}
.btn.ghost{background:transparent}
.btn.has-dot{position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:var(--r-round);background:var(--badge-bg);box-shadow:0 0 0 2px var(--card)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.big{font-size:var(--fs-5xl);padding:var(--sp-4) var(--sp-4)}
.btn.sm{font-size:var(--fs-md);padding:var(--sp-2) var(--sp-2h)}
input[type=text]{font-family:var(--body);font-weight:700;font-size:var(--fs-xl);border:1px solid var(--line-ctl);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-3);background:var(--bg2);width:100%;color:var(--text)}
input[aria-invalid=true]{border-color:var(--bad)}
.field-err{color:var(--bad);font-weight:700}
textarea{border-color:var(--line-ctl)}
input[type=text]:focus{outline:2px solid var(--team);border-color:transparent}
label{display:flex;flex-direction:column;gap:var(--sp-1)}
.opts{display:flex;flex-wrap:wrap;gap:var(--sp-1h)}
.opt{font-family:var(--body);font-weight:700;font-size:var(--fs-md);border:1px solid var(--line-ctl);background:var(--bg2);color:var(--text);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1)}
.opt.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.opt:disabled,.opt[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.opt.locked{border-style:dashed;color:var(--muted);opacity:1}
.opt.locked .ico-lock{color:var(--gold);flex-shrink:0}
.opt .cc{font-family:var(--display);font-size:var(--fs-xs);letter-spacing:1px;opacity:.7;margin-right:5px}
.sw{position:relative;width:32px;height:32px;border-radius:var(--r-round);border:2px solid var(--line-ctl);cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;inset:-6px}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
canvas{display:block;max-width:100%}

/* Üst şerit */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg2);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:var(--sp-2h) max(16px,env(safe-area-inset-right,0px)) var(--sp-2h) max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:var(--sp-2)}
@media (min-width:600px){.hud{border-radius:0 0 var(--r-2xl) var(--r-2xl);border:1px solid var(--line);border-top:0}}
.hud-id{display:flex;align-items:center;gap:var(--sp-2h);min-width:0}
.hud-id .nm{font-family:var(--display);font-size:var(--fs-4xl);font-weight:700;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-id .tm{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-money{margin-left:auto;text-align:right;flex-shrink:0}
.hud-money b{font-family:var(--display);font-size:var(--fs-5xl);font-weight:700;display:block;line-height:1;color:var(--gold)}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-1h)}
.hs{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-1) var(--sp-2);min-width:0}
.hs .k{font-family:var(--display);font-size:var(--fs-2xs);letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs .v{font-family:var(--display);font-size:var(--fs-2xl);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt{height:3px;background:var(--line);border-radius:var(--r-2xs);margin-top:3px;overflow:hidden}
.mt i{display:block;height:100%;background:var(--good)}
.avatar{width:42px;height:42px;border-radius:var(--r-lg);background:var(--card2);border:1px solid var(--line2);flex-shrink:0;overflow:hidden}
button.avatar{position:relative;padding:0;cursor:pointer;color:inherit;overflow:visible}
button.avatar canvas{border-radius:inherit;overflow:hidden}
button.avatar::after{content:"";position:absolute;inset:-4px}
button.avatar:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* Harita */
.mapwrap{position:relative;border-radius:var(--r-3xl);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.mapwrap svg{display:block;width:100%;height:auto}
.mapin{position:relative;width:100%}
.maphead{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:var(--sp-2);pointer-events:none}
.tagx{background:rgba(9,13,21,.84);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);border-radius:var(--r-md);padding:var(--sp-1) var(--sp-2);font-family:var(--display);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:var(--fs-md);line-height:1.1;color:var(--text)}
.tagx small{display:block;font-family:var(--body);font-weight:600;letter-spacing:0;text-transform:none;font-size:max(var(--fs-min),var(--fs-2xs));color:var(--muted)}
/* harita etiketleri: SVG ölçeklenirken ekranda en az 11 px ve yazı boyutu ayarına uyar (--lab-k, src/map.js) */
.mapwrap .lab{transform-box:fill-box;transform-origin:center;transform:scale(var(--lab-k,1))}
.loc{cursor:pointer;outline:none}
.loc .hl{opacity:0;transition:opacity .15s}
.loc:hover .hl,.loc:focus-visible .hl,.loc:active .hl{opacity:1}
.loc.off{opacity:.5}
.timebar{display:flex;gap:var(--sp-1);align-items:center}
.timebar i{flex:1;height:6px;border-radius:var(--r-xs);background:var(--line)}
.timebar i.on{background:var(--gold)}
.next{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-3);align-items:center}
.vs{font-family:var(--display);font-weight:700;color:var(--muted);font-size:var(--fs-base)}
.news div{padding:var(--sp-2) 0;border-top:1px solid var(--line);font-size:var(--fs-md);display:grid;grid-template-columns:52px 1fr;gap:var(--sp-2)}
.news div:first-child{border-top:0}
.news time{font-family:var(--display);color:var(--muted);font-size:var(--fs-sm);letter-spacing:.6px;padding-top:1px}

/* Panel */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,12,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{position:relative;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-4xl) var(--r-4xl) 0 0;width:100%;max-width:560px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;animation:up .22s ease-out;transition:transform .18s ease-out}
.sheet:focus{outline:none}
.grab{width:40px;height:5px;border-radius:var(--r-pill);background:var(--line-ctl);margin:var(--sp-2) auto 0;flex-shrink:0}
.grab+.sheet-h{padding-top:var(--sp-2)}
.sheet-h{display:flex;align-items:center;gap:var(--sp-2h);padding:var(--sp-3h) max(16px,env(safe-area-inset-right,0px)) var(--sp-2h) max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-b>*{flex-shrink:0}
.sheet-b{overflow:auto;padding:var(--sp-3h) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--sp-2h)}
.x{margin-left:auto;width:var(--hit);height:var(--hit);border-radius:var(--r-round);border:1px solid var(--line-ctl);background:var(--card);color:var(--text);font-size:var(--fs-3xl);cursor:pointer;flex-shrink:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
/* ekran geçişi ve düşük grafik modu */
.app.enter>*{animation:enter .26s ease both}.app.enter>*:nth-child(2){animation-delay:.03s}.app.enter>*:nth-child(3){animation-delay:.06s}.app.enter>*:nth-child(4){animation-delay:.09s}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
body.lowfx *,body.lowfx *::before,body.lowfx *::after{animation:none!important;transition:none!important}
body.lowfx .sheet-bg{backdrop-filter:none}
/* erişilebilirlik: yazı boyutu (rem tabanı ölçeklenir) ve renk körlüğü modu (yeşil/kırmızı yerine mavi/turuncu) */
html.fs-l{font-size:18px} html.fs-l body{font-size:15.75px}
html.fs-xl{font-size:20px} html.fs-xl body{font-size:17.5px} html.fs-xl [data-dist]{font-size:.88em}
html.cb{--good:#4aa8ff;--bad:#ff9b3d;--on-good:var(--on-info)}
/* paket 4a: küçük yazı, renk körü ek bölgeler, yüksek kontrast (tema değişkenlerinin üstüne çıkar), ekran okuyucu, ilk maç rehberi */
html.fs-s{font-size:14.5px} html.fs-s body{font-size:12.75px}
html.cb[data-theme]{--good:#4aa8ff;--bad:#ff9b3d}
html.hc,html.hc[data-theme]{--bg:#000;--bg2:#05070b;--card:#0b0f17;--card2:#121826;--line:#5b6b86;--line2:#8fa1c2;--line-ctl:#8fa1c2;--sel:#ffffff;--on-sel:#000;--text:#fff;--muted:#d0d8e6;--dim:#a9b4c6;--gold:#ffd166}
html.hc .btn,html.hc .opt,html.hc .choice,html.hc .card,html.hc .act{border-width:2px}
html.hc :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mt-hl{outline:3px solid var(--gold);outline-offset:3px;border-radius:var(--r-lg);animation:mtPulse 1s ease-in-out infinite alternate}
@keyframes mtPulse{to{outline-color:color-mix(in srgb,var(--gold) 35%,transparent)}}
.mt-bub{position:fixed;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:46;border-color:var(--gold);box-shadow:var(--shadow-2)}
.mt-bub .grid2 .btn{min-height:40px}
.act{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2h) var(--sp-3);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--sp-2h) var(--sp-3)}
.act .ai{width:52px;height:52px;border-radius:var(--r-lg);background:radial-gradient(circle at 50% 35%,#24324b,#121a28);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act .ai svg{width:40px;height:40px}
.act h3{font-size:var(--fs-xl)}
.act>.btn{grid-column:1/-1;width:100%}
.act>span:first-child{display:none}
.act p{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.fx{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:6px}
.fx span{font-size:var(--fs-2xs);font-weight:800;border-radius:var(--r-xs);padding:var(--sp-half) var(--sp-1h);background:var(--card2);color:var(--muted)}
.fx .p{color:var(--good);background:var(--good-soft)} .fx .n{color:var(--bad);background:var(--bad-soft)} .fx .t{color:var(--warn);background:var(--warn-soft)}
/* sekmeler: tek satır, sığmazsa yatay kaydırılan segment (4'lü panelde 3+1 kırılmaz) */
.tabs{display:flex;flex-wrap:nowrap;gap:var(--sp-1h);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:2px}
.tabs button{flex:1 0 auto;scroll-snap-align:start;min-width:0;display:flex;align-items:center;justify-content:center;gap:var(--sp-1h);font-family:var(--display);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:var(--fs-md);background:var(--card);color:var(--muted);border:1px solid var(--line-ctl);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-3);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-tab)}
.tabs button:hover{color:var(--text);border-color:var(--muted)}
.tabs button.on{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.tabs button svg{width:16px;height:16px}
.attr{display:grid;grid-template-columns:86px 1fr 34px;gap:var(--sp-2h);align-items:center;font-weight:700;font-size:var(--fs-md)}
.attr b{font-family:var(--display);font-size:var(--fs-3xl);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:var(--r-xs);overflow:hidden}
.bar i{display:block;height:100%;background:var(--team);border-radius:var(--r-xs)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th{font-family:var(--display);font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-size:var(--fs-xs);text-align:left;padding:var(--sp-1h) var(--sp-1);border-bottom:1px solid var(--line)}
td{padding:var(--sp-2) var(--sp-1);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.me td{background:rgba(255,255,255,.05);font-weight:800}
.tbl{overflow-x:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:var(--sp-1h) var(--sp-3);font-size:var(--fs-md)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.big-num{font-family:var(--display);font-weight:800;font-size:var(--fs-big);line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;letter-spacing:.8px;font-size:var(--fs-xs);text-transform:uppercase;border-radius:var(--r-xs);padding:var(--sp-half) var(--sp-2);background:var(--card2);color:var(--muted)}
.pill.w{background:var(--good-bg);color:var(--good)} .pill.l{background:var(--bad-bg);color:var(--bad)} .pill.g{background:var(--gold-bg);color:var(--gold)}
.toast.top{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-left:4px solid var(--team);border-radius:var(--r-lg);padding:var(--sp-2h) var(--sp-3h);font-weight:700;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow-1)}
.say{background:var(--card2);border-radius:var(--r-xl);padding:var(--sp-2h) var(--sp-3);font-weight:600;font-size:var(--fs-base);border-left:3px solid var(--team)}
.say.good{border-left-color:var(--good)} .say.bad{border-left-color:var(--bad)} .say.warn{border-left-color:var(--warn)} .say.gold{border-left-color:var(--gold)} .say.info{border-left-color:var(--info)} .say.muted{border-left-color:var(--muted)}
.say.good,.say.bad,.say.warn,.say.gold,.say.info,.say.muted{color:inherit}
.who{display:grid;grid-template-columns:84px 1fr;gap:var(--sp-3);align-items:start}
.chapter{border-radius:var(--r-3xl);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.chapter .hd{padding:var(--sp-4h) var(--sp-4) var(--sp-3h);background:var(--team);color:var(--team-ink)}
.chapter .bd{padding:var(--sp-3h) var(--sp-4) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2h)}

/* Sahneler ve ürünler */
.scene{position:relative;border-radius:var(--r-2xl);overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.scene canvas{width:100%;height:auto}
.bubble{position:absolute;right:10px;top:10px;max-width:55%;background:#fff;color:#141414;border-radius:var(--r-xl);padding:var(--sp-2) var(--sp-2h);font-weight:700;font-size:var(--fs-sm);line-height:1.3;box-shadow:var(--shadow-md)}
.bubble.l{right:auto;left:10px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2h)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--sp-2h);display:flex;flex-direction:column;gap:var(--sp-1h);min-width:0}
.prod .ic{background:radial-gradient(circle at 50% 38%,#26354f,#111926 75%);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;aspect-ratio:1.5}
.prod .ic svg{width:62%;height:auto;max-height:84%}
.prod h3{font-size:var(--fs-lg)}
.prod p{font-size:var(--fs-xs);color:var(--muted)}
.prod .btn{margin-top:auto}
.prod.own{opacity:.7}

/* Maç */
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);background:var(--card);margin-top:10px}
.bug .side{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-2h);min-width:0}
.bug .side.r{flex-direction:row-reverse;text-align:right}
.bug .ab{font-family:var(--display);font-weight:800;font-size:var(--fs-2xl);letter-spacing:1px;line-height:1}
.bug .full{font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.bug .sc{font-family:var(--display);font-weight:800;font-size:var(--fs-num);line-height:1;margin-left:auto;font-variant-numeric:tabular-nums}
.bug .side.r .sc{margin-left:0;margin-right:auto}
.bug .mid{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-1) var(--sp-2h);min-width:70px}
.bug .q{font-family:var(--display);font-weight:700;color:var(--warn);font-size:var(--fs-md);letter-spacing:1px}
.bug .clk{font-family:var(--display);font-weight:700;font-size:var(--fs-3xl);font-variant-numeric:tabular-nums}
.stripe{width:5px;align-self:stretch;border-radius:var(--r-xs);flex-shrink:0}
.sit{display:flex;flex-direction:column;gap:var(--sp-3)}
.choices{display:flex;flex-direction:column;gap:var(--sp-2)}
.choice{display:grid;grid-template-columns:1fr auto;gap:var(--sp-half) var(--sp-2h);align-items:center;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-xl);padding:var(--sp-3) var(--sp-3h);color:var(--text);cursor:pointer;font-family:var(--body)}
.choice:active{transform:scale(.98)}
.choice .ct{font-family:var(--display);font-weight:700;font-size:var(--fs-4xl);text-transform:uppercase;letter-spacing:.5px}
.choice .cd{font-size:var(--fs-sm);color:var(--muted);grid-column:1}
.choice .od{grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:var(--fs-sm);padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm)}
.od.e{background:var(--good-bg);color:var(--good)} .od.m{background:var(--warn-bg);color:var(--warn)} .od.h{background:var(--bad-bg);color:var(--bad)} .od.i{background:var(--info-bg);color:var(--info)}
.stage{background:var(--stage-bg);border:1px solid var(--line);border-radius:var(--r-2xl);overflow:hidden;display:flex;flex-direction:column}
.stage canvas{width:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* Mobil dokunuş: çift dokunuşta yakınlaştırma yok, oyun alanında metin seçimi ve uzun basma menüsü yok */
button,.loc,.choice,.opt,.venue,.tabs button{touch-action:manipulation}
.btn,.choice,.opt,.tabs,.stage,.mgctrl,.hud,.mapwrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{overscroll-behavior-y:none}
textarea,input[type=text]{font-size:16px;box-sizing:border-box;min-width:0;max-width:100%}
.grid2>*{min-width:0}
.sheet-h .shx,#shx{min-width:var(--hit);min-height:var(--hit)}
/* tek elle kullanım: uzun panellerde birincil düğme parmak bölgesinde (altta yapışkan), karar kartları büyük ve alta hizalı */
.sheet-b>.btn.pri:last-child,.sn-pane>.btn.pri:last-child{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 12px -4px var(--bg2)}
/* yapışkan birincil düğme son içeriği (reklam düğmesi vb.) örtmesin: kaydırma sonunda altta boşluk kalır */
.sheet-b:has(>.btn.pri:last-child){scroll-padding-bottom:72px}
.sheet-b:has(>.btn.pri:last-child)>:nth-last-child(2){margin-bottom:var(--sp-2)}
.sheet-b>.choices:last-child{margin-top:auto}
@media (pointer:coarse){.choice{min-height:58px;padding:var(--sp-4) var(--sp-4)}}
/* Sezon Gecesi sekmeleri (src/seasonnight.js) */
.sn-tabs{position:sticky;top:0;z-index:3;background:var(--bg2);padding-bottom:var(--sp-1)}
.sn-pane{display:flex;flex-direction:column;gap:var(--sp-2h)}.sn-pane>*{flex-shrink:0}.sn-pane[hidden]{display:none}
/* bildirim kutusu zili ve koç önerisi (src/inbox.js) */
.ibx-bell{position:relative;flex-shrink:0;width:var(--hit);height:var(--hit);display:grid;place-items:center;background:var(--card);border:1px solid var(--line-ctl);border-radius:var(--r-lg);color:var(--text);cursor:pointer;padding:0}
.ibx-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 var(--sp-1);border-radius:var(--r-pill);background:var(--badge-bg);color:var(--on-badge);font-size:max(var(--fs-min),var(--fs-2xs));font-weight:800;display:grid;place-items:center;line-height:1}
.ibx-n[hidden]{display:none}
.ctip{margin-top:6px;padding:var(--sp-1h) var(--sp-2h);border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:var(--r-sm);line-height:1.3}
@media (pointer:coarse){.btn{min-height:var(--hit)}.opt{min-height:var(--hit);min-width:var(--hit)}.tabs button{min-height:var(--hit)}.weekcard .btn{min-height:var(--hit-coarse)}}
/* basış geri bildirimi (hafif koyulaşma + küçülme) */
.opt:active,.tabs button:active,.x:active,.qbtn:active,.ibx-bell:active,.venue:active,.sw:active,.tgl:active,button.avatar:active{transform:scale(.97);filter:brightness(.88)}
.opt,.tabs button,.x,.qbtn,.ibx-bell,.venue,.sw,.tgl{transition:transform .08s,filter .08s}
/* ayarlar: satır içi aç/kapa anahtarı ve gruplar */
.set-g{margin-top:var(--sp-2);color:var(--text)}
.act.swr{grid-template-columns:1fr auto}
.tgl{position:relative;width:52px;height:32px;flex-shrink:0;border-radius:var(--r-pill);border:1px solid var(--line-ctl);background:var(--bg2);cursor:pointer;padding:0}
.tgl::before{content:"";position:absolute;inset:-6px 0}
.tgl-k{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:var(--r-round);background:var(--muted);transition:left .15s}
.tgl[aria-checked=true]{background:var(--sel);border-color:var(--sel)}
.tgl[aria-checked=true] .tgl-k{left:23px;background:var(--on-sel)}
.tgl:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
/* kariyer oluşturma: gelişmiş seçenekler ve yapışkan başlat düğmesi */
details.adv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);min-height:var(--hit)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary>span{display:flex;flex-direction:column;gap:2px}
details.adv>summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:6px;flex-shrink:0}
details.adv[open]>summary::after{transform:rotate(-135deg)}
details.adv>summary:focus-visible{outline:2px solid var(--warn);outline-offset:2px;border-radius:var(--r-sm)}
.cta-bar{position:sticky;bottom:0;z-index:5;padding:var(--sp-2) 0 calc(var(--sp-2) + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cta-bar .btn{width:100%}
/* boş durum (bildirim kutusu vb.) */
.empty-st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-2);padding:var(--sp-6) var(--sp-4)}
.empty-ic{width:72px;height:72px;border-radius:var(--r-round);background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
/* kayıt yapılamıyor: kapatılana kadar kalan uyarı */
#savewarn{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:41;width:min(520px,calc(100% - 24px));display:flex;gap:var(--sp-2);align-items:flex-start;background:var(--card2);border:1px solid var(--bad);border-left:4px solid var(--bad);border-radius:var(--r-lg);padding:var(--sp-2h) var(--sp-3);box-shadow:var(--shadow-1)}
#savewarn .btn{margin-top:var(--sp-2)}
/* Yatay telefonda oyun alanı ekrana sığsın */
@media (orientation:landscape) and (max-height:560px){.stage{width:min(100%,calc((100dvh - 120px)*.75));align-self:center;margin-inline:auto}.mgctrl .btn{padding:var(--sp-2h) 0}}
.mgtop{display:flex;justify-content:space-between;gap:var(--sp-2);font-family:var(--display);font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-base);border-bottom:1px solid var(--line)}
.mgctrl{display:flex;gap:var(--sp-2);justify-content:center;padding:var(--sp-2h);flex-wrap:nowrap}
.mgctrl:empty{display:none}
.mgctrl .btn{flex:1;font-size:var(--fs-h2);padding:var(--sp-4) 0;min-width:0}
.feed div{padding:var(--sp-1h) 0;border-top:1px solid var(--line);display:grid;grid-template-columns:58px 1fr;gap:var(--sp-2);font-size:var(--fs-md)}
.feed div:first-child{border-top:0}
.feed time{font-family:var(--display);color:var(--muted);letter-spacing:.5px}
.box{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-1h);text-align:center}
.box div{background:var(--card2);border-radius:var(--r-lg);padding:var(--sp-2) var(--sp-1)}
.box b{display:block;font-family:var(--display);font-size:var(--fs-7xl);line-height:1;font-weight:800}
.rating{font-family:var(--display);font-weight:800;font-size:var(--fs-hero);line-height:.9}

/* Quiz, gönderi, kumar */
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.qbtn{background:var(--card);border:1px solid var(--line-ctl);border-radius:var(--r-xl);padding:var(--sp-3);color:var(--text);font-family:var(--body);font-weight:700;font-size:var(--fs-base);cursor:pointer;text-align:left;min-height:52px}
.qbtn.ok{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good)} .qbtn.no{background:var(--bad-bg);border-color:var(--bad)}
.post{background:#fff;color:#141414;border-radius:var(--r-3xl);overflow:hidden;box-shadow:var(--shadow-1)}
.post .ph{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2h) var(--sp-3);font-weight:800;font-size:var(--fs-md)}
.post .ph i{width:28px;height:28px;border-radius:var(--r-round);background:var(--team);display:block}
.post img{display:block;width:100%;height:auto}
.post .pb{padding:var(--sp-2h) var(--sp-3);font-size:var(--fs-md);display:flex;flex-direction:column;gap:var(--sp-1)}
.post .lk{font-weight:800}
.felt{background:radial-gradient(circle at 50% 30%,#17734a,#0a3a25 80%);border:1px solid #1f6b47;border-radius:var(--r-2xl);padding:var(--sp-3h);display:flex;flex-direction:column;gap:var(--sp-3);align-items:center}
.hand{display:flex;gap:var(--sp-1h);min-height:78px;flex-wrap:wrap;justify-content:center}
.cardx{width:52px;height:76px;border-radius:var(--r-md);background:#fff;color:#141414;display:flex;flex-direction:column;justify-content:space-between;padding:var(--sp-1) var(--sp-1h);font-family:var(--display);font-weight:800;font-size:var(--fs-4xl);line-height:1;box-shadow:var(--shadow-sm);animation:deal .25s ease-out}
.cardx.red{color:#d0142c} .cardx.back{background:repeating-linear-gradient(45deg,#8a1d2a 0 6px,#a8273a 6px 12px);border:3px solid #fff}
.cardx span:last-child{align-self:flex-end;transform:rotate(180deg)}
@keyframes deal{from{transform:translateY(-20px) rotate(-8deg);opacity:0}}
.reels{display:flex;gap:var(--sp-2);justify-content:center;background:#1b0d0d;padding:var(--sp-3);border-radius:var(--r-2xl);border:3px solid var(--gold)}
.reel{width:84px;height:92px;background:#fffaf0;border-radius:var(--r-lg);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 8px 14px rgba(0,0,0,.25),inset 0 -8px 14px rgba(0,0,0,.25)}
.reel svg{width:58px;height:58px}
.reel.spin svg{animation:spin .09s linear infinite}
@keyframes spin{from{transform:translateY(-36px)}to{transform:translateY(36px)}}
.venues{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2h)}
.venue{position:relative;padding:0;border:2px solid var(--line2);border-radius:var(--r-2xl);overflow:hidden;background:var(--card);cursor:pointer;text-align:left;color:var(--text)}
.venue canvas{width:100%;height:auto;display:block;filter:saturate(.75) brightness(.7)}
.venue .vlab{position:absolute;left:0;right:0;bottom:0;padding:var(--sp-2) var(--sp-2h);background:linear-gradient(transparent,rgba(5,8,14,.95));display:flex;flex-direction:column}
.venue .vlab b{font-family:var(--display);font-size:var(--fs-3xl);letter-spacing:.8px;text-transform:uppercase;line-height:1}
.venue .vlab small{font-size:var(--fs-2xs);color:var(--muted)}
.venue.on{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.venue.on canvas{filter:none}
.venue.on .vlab b{color:var(--gold)}
.venue:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
@media (max-width:380px){h1{font-size:var(--fs-h1-sm)}.reel{width:70px}}
@media (prefers-reduced-motion:reduce){.app.enter>*,.sheet,.sheet-bg,.cardx{animation:none}.btn,.loc .hl{transition:none}.reel.spin svg{animation-duration:.4s}}
/* Reklam */
.adbtn{display:flex;flex-direction:column;align-items:center;gap:var(--sp-half);position:relative;padding-top:var(--sp-4h)}
.adbtn small{font-family:var(--body);font-size:var(--fs-2xs);font-weight:600;text-transform:none;letter-spacing:0;opacity:.75}
.adtag{position:absolute;top:4px;left:8px;font-size:var(--fs-3xs);letter-spacing:1px;background:rgba(0,0,0,.35);border-radius:var(--r-xs);padding:1px var(--sp-1)}
#adov{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.94);display:flex;align-items:center;justify-content:center;padding:calc(var(--sp-5) + env(safe-area-inset-top,0px)) var(--sp-5) calc(var(--sp-5) + env(safe-area-inset-bottom,0px));animation:fade .2s}
.adbox{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-3xl);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3h)}
.adbody{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:var(--r-xl);padding:var(--sp-5h) var(--sp-4);min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn[aria-busy=true]{cursor:progress}
/* Mobil sığdırma: kaydırma çubukları gizli (kaydırma çalışmaya devam eder);
   ana ekranda şerit, harita ve "Bu hafta" kartı tek ekrana sığar */
@media (pointer:coarse),(max-width:700px){
  html,body,*{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0!important;height:0!important;display:none}
}
@media (max-width:600px){
  .app{gap:var(--sp-2h)}
  .hud{padding-top:var(--sp-2);padding-bottom:var(--sp-2);gap:var(--sp-1h)}
  .avatar{width:36px;height:36px;border-radius:var(--r-md)}
  .hud-id .nm{font-size:var(--fs-3xl)}
  .hud-money b{font-size:var(--fs-3xl)}
  .hud-stats{gap:var(--sp-1)}
  .hs{padding:var(--sp-1) var(--sp-1h)}
  .hs .k{font-size:max(var(--fs-min),var(--fs-3xs));letter-spacing:.3px}
  .hs .v{font-size:var(--fs-lg)}
  /* harita alanı genişlikte tam doldurur (yanlarda boşluk yok). Yükseklik: maç kartı ekranda kalacak kadar; ekran
     yetmezse yalnızca üstteki gökyüzü/silüet kırpılır (en fazla %12, mekanlar ve etiketleri hep görünür), daha kısa ekranda sayfa kayar */
  .mapin{width:100%}
  .mapwrap svg{--nat:calc((100vw - 48px) * 1.675);width:100%;height:clamp(calc(var(--nat) * .88),calc(100dvh - 320px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),var(--nat))}
  .maphead{left:6px;right:6px;top:6px;gap:var(--sp-1)}
  .maphead .tagx{font-size:var(--fs-sm);padding:var(--sp-1) var(--sp-2);max-width:50%}
  .maphead .tagx small{font-size:max(var(--fs-min),var(--fs-3xs))}
  /* maç kartı dikeyde sıkı (yakınlaştırma yok: düğmeler tam dokunma alanında) */
  .weekcard{padding:var(--sp-2) var(--sp-3);gap:var(--sp-1h)}
  .weekcard .next{padding:var(--sp-half) 0;gap:var(--sp-2h)}
  .weekcard .btn{padding:var(--sp-2) var(--sp-3);min-height:var(--hit)}
}
@media (pointer:coarse){.app .weekcard .btn{min-height:var(--hit-coarse)}}
