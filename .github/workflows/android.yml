# Android derlemesi: her push'ta hata ayıklama APK'sı (test için doğrudan kurulabilir) üretilir.
# GitHub Secrets'ta ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# tanımlıysa Google Play'e yüklenecek imzalı yayın paketi (AAB) de üretilir; bunun için AdMob kimlikleri de gerekir
# (ADMOB_APP_ID, ADMOB_REWARDED_ANDROID, ADMOB_INTERSTITIAL_ANDROID). Ayrıntılar: docs/YAYIN_KONTROL.md
name: Android
on:
  push:
  workflow_dispatch:
# apk-latest sürümüne APK yüklemek için (yalnızca main dalında)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Hata ayıklama APK'sı
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pota-kariyeri-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # main'deki her derleme sabit adresli "apk-latest" sürümüne yüklenir; QR sayfasından telefona doğrudan indirilir:
      # https://github.com/Ceomai/basketball/releases/download/apk-latest/pota-kariyeri.apk
      - name: APK'yı sabit adrese yükle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk pota-kariyeri.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Pota Kariyeri · test APK" --notes "Test APK'sı"
          gh release upload apk-latest pota-kariyeri.apk --clobber
          gh release edit apk-latest --notes "Test APK'sı (hata ayıklama sürümü). Son derleme ${GITHUB_SHA::7}, sürüm 1.0.${{ github.run_number }}. Kurulum: telefonda indir, bilinmeyen kaynaklardan yüklemeye izin ver, kur."

      # Yayın paketi: gerçek AdMob kimlikleriyle YENİDEN derlenir (test APK'sı test kimlikleriyle kalır; kendi
      # reklamına tıklamak AdMob hesabını kapatabilir). Önce yayın kapısı: test kimliği, yer tutucu vb. varsa durur.
      # Gerekli Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
      #   ADMOB_APP_ID, ADMOB_REWARDED_ANDROID, ADMOB_INTERSTITIAL_ANDROID
      # İsteğe bağlı Variables: ALLOW_TEST_ADS=1 (kapalı testte bilerek test reklamı), VERSION_CODE_OFFSET (elle yüklenmiş
      #   bir AAB'den büyük sürüm kodu gerekiyorsa). Ayrıntı: docs/YAYIN_KONTROL.md
      - name: Yayın kapısı ve yayın derlemesi
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VITE_ADMOB_REWARDED_ANDROID: ${{ secrets.ADMOB_REWARDED_ANDROID }}
          VITE_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.ADMOB_INTERSTITIAL_ANDROID }}
          ALLOW_TEST_ADS: ${{ vars.ALLOW_TEST_ADS }}
          VITE_ALLOW_TEST_ADS: ${{ vars.ALLOW_TEST_ADS }}
        run: |
          node tools/release-check.js
          npm run build
          node tools/release-check.js --dist
          npx cap sync android
      - name: Yayın paketi (imzalı AAB)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ALLOW_TEST_ADS: ${{ vars.ALLOW_TEST_ADS }}
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: pota-kariyeri-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
