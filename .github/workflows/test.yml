name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # sağlamlık: maymun oyuncu (8 koşu × 45 sn) ve uç durumlar (24 durum); her güncellemede farklı tohum
      - run: node tests/fuzz.js 8 45 ${{ github.run_number }}
      - run: node tests/fuzz-state.js 24 ${{ github.run_number }}
      # kapsamlı denetim paketi: işlevsel, uç durum, güvenlik (CSP dahil), arayüz ve performans testleri
      - run: npm run build
      - run: node tests/audit.js
